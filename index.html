<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>kuva</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #view { display: block; width: 100vw; height: 100vh; }
    /* 「状態」パネル（左下） */
    #stat { position: fixed; left: 8px; bottom: 8px; width: 320px; }
    body.bare { cursor: none; }
    /* Tweakpane：日本語の長いラベルが切れないよう幅を広げ、画面より高いときはスクロールさせる。Tweakpane が後から入れる CSS に負けないよう html を付けている（kivi と同じ） */
    html .tp-dfwv { width: 360px; max-height: calc(100vh - 16px); overflow-y: auto; }
    /* キー操作の一覧（パネルの一番下）。色と文字は Tweakpane に合わせる */
    .keys { display: grid; grid-template-columns: 5em 1fr; gap: 2px 8px; margin: 0; padding: 4px 8px 8px;
      font: 11px/1.6 var(--tp-base-font-family, monospace); color: var(--tp-label-foreground-color, #aaa); }
    .keys dt { color: var(--tp-button-foreground-color, #ddd); }
    .keys dd { margin: 0; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="stat"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
