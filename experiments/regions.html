<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kuva — 領域の変化を比較</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #151515; color: #ddd; font: 13px/1.6 system-ui, sans-serif; }
    header { padding: 12px 20px; display: flex; flex-wrap: wrap; gap: 4px 24px; align-items: baseline; }
    h1 { font-size: 16px; margin: 0; color: white; }
    p { margin: 0; color: #aaa; }
    #status { color: #d1dfa3; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 20px 16px; }
    article { min-width: 0; background: #080808; }
    h2 { margin: 0; padding: 6px 10px; font-size: 13px; font-weight: 500; }
    .count { float: right; color: #aaa; }
    .frame { position: relative; aspect-ratio: 1376 / 864; }
    canvas { position: absolute; width: 100%; height: 100%; display: block; }
    .outline { pointer-events: none; }
    footer { padding: 0 20px 16px; color: #aaa; }
    a { color: #ddd; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>kuva / 領域の変化を比較</h1>
    <p>Space 再生・停止 ／ R 最初から ／ B 境界線 ／ 写真をドロップで変更</p>
    <span id="status">読み込み中…</span>
  </header>
  <main></main>
  <footer>同じ写真・seed・世代で比較。漏れは60%。違いを見るため、写真の流し込みと模様はOFF。<a href="/">通常の操作画面へ</a></footer>
  <script type="module" src="./regions.js"></script>
</body>
</html>
